<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell Equipment Technology | Assembly Dashboard</title>
    <script>
      try {
        if (localStorage.getItem('eqp_theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {}
    </script>
    <style>
      /* Color tokens from BM Dashboard app/globals.css. */
      html[data-theme="light"] {
        color-scheme: light;
        --background: hsl(220 29% 95%);
        --foreground: hsl(222 47% 11%);
        --card: hsl(0 0% 100%);
        --primary: hsl(172.68 40% 30%);
        --primary-foreground: hsl(0 0% 100%);
        --muted: hsl(225 40% 98%);
        --muted-foreground: hsl(215 19% 40%);
        --accent: hsl(220 29% 95%);
        --border: hsl(220 20% 86%);
        --ring: hsl(172.68 40% 30%);
      }
      :root {
        color-scheme: dark;
        --background: hsl(230 20% 6%);
        --foreground: hsl(240 10% 96%);
        --card: hsl(231 15% 9%);
        --primary: hsl(172.68 34.75% 46.27%);
        --primary-foreground: hsl(230 20% 6%);
        --muted: hsl(233 14% 11%);
        --muted-foreground: hsl(218 11% 65%);
        --accent: hsl(231 16% 16%);
        --border: hsl(231 16% 22%);
        --ring: hsl(172.68 34.75% 46.27%);
      }
      @font-face {
        font-family: Geist;
        src: url('./assets/GeistVF.woff') format('woff');
        font-weight: 100 900;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        padding-block: 60px;
        font: 14px/1.5 Geist, system-ui, sans-serif;
        background: var(--background);
        color: var(--foreground);
        isolation: isolate;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: url('./assets/cleanroom.svg') center / cover no-repeat;
        opacity: .32;
      }
      [data-theme="light"] body::before { opacity: .52; }
      @media (max-width: 600px) {
        body::before { background-position: 33% center; }
      }
      main {
        width: min(520px, calc(100% - 32px));
        place-self: center;
        margin: 16px 0;
        text-align: center;
        padding: clamp(16px, 4vw, 28px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      h1 { margin: 0; font-size: clamp(21px, 5vw, 26px); letter-spacing: -.025em; }
      .section-title { margin: 4px 0 0; font-size: 17px; font-weight: 600; }
      .subtitle { margin: 4px 0 20px; color: var(--muted-foreground); }
      .link-button, .theme-toggle {
        border: 1px solid var(--border);
        border-radius: 8px;
        color: inherit;
        background: var(--muted);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      .link-button { display: block; padding: 10px 12px; margin: 8px 0; }
      .theme-toggle {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .theme-toggle[hidden], .moon, [data-theme="light"] .sun { display: none; }
      [data-theme="light"] .moon { display: block; }
      .primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
      .link-button small { display: block; font-size: 12px; font-weight: 500; }
      a:hover:not(.primary), button:hover { background: var(--accent); }
      .primary:hover { filter: brightness(.9); }
      :focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode" hidden>
      <svg class="sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
      </svg>
      <svg class="moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M20.9 13.4A9 9 0 1 1 10.6 3.1a7 7 0 0 0 10.3 10.3Z" />
      </svg>
    </button>
    <main>
      <h1>Cell Equipment Technology</h1>
      <p class="section-title">Assembly - Dashboard</p>
      <p class="subtitle">All-in-one equipment management platform</p>

      <a
        href="http://10.99.65.254:3000/downtime-form"
        class="link-button primary"
      >
        Create BM Report
        <small>AZS / PKG</small>
      </a>

      <a
        href="http://10.99.65.254:3000"
        class="link-button"
      >
        BM Dashboard
        <small>AZS / PKG</small>
      </a>
    </main>
    <script>
      const root = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      function updateToggle() {
        const label = root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        toggle.setAttribute('aria-label', label);
        toggle.title = label;
      }
      toggle.addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('eqp_theme', root.dataset.theme); } catch {}
        updateToggle();
      });
      updateToggle();
      toggle.hidden = false;
    </script>
  </body>
</html>
